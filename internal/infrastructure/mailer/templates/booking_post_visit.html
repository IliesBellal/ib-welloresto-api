<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci de votre visite</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden; max-width:600px; width:100%;">
                    <tr>
                        <td align="center" style="padding:24px;">
                            <img src="{{.BrandLogoURL}}" alt="{{.BrandName}}" width="120" style="display:block; border:0;">
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 24px 32px; color:#18181b;">
                            <h1 style="font-size:20px; margin:0 0 16px 0;">Merci de votre visite&nbsp;!</h1>
                            <p style="font-size:15px; line-height:1.5; margin:0 0 12px 0;">Bonjour {{.CustomerName}},</p>
                            <p style="font-size:15px; line-height:1.5; margin:0 0 12px 0;">
                                Merci d'avoir choisi <strong>{{.MerchantName}}</strong>. Nous espérons vous revoir
                                très bientôt&nbsp;!
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 32px; background-color:#fafafa; color:#71717a; font-size:12px;">
                            Besoin d'aide ? Contactez-nous à
                            <a href="mailto:{{.SupportEmail}}" style="color:#4f46e5; text-decoration:none;">{{.SupportEmail}}</a>
                            <br>© {{.Year}} {{.BrandName}}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
