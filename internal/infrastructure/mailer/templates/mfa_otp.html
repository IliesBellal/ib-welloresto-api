<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f7; color: #333;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <tr>
                        <td align="center" style="padding: 30px; border-bottom: 1px solid #e5e7eb;">
                            <img src="{{.BrandLogoURL}}" alt="{{.BrandName}}" width="100">
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px 30px; text-align: center;">
                            <h1 style="margin: 0 0 10px; font-size: 22px; color: #111827;">Code de vérification</h1>
                            <p style="margin: 0 0 30px; font-size: 16px; color: #4b5563;">Utilisez le code ci-dessous pour sécuriser votre connexion.</p>
                            
                            <div style="background-color: #f3f4f6; border-radius: 8px; padding: 20px; display: inline-block; letter-spacing: 5px;">
                                <span style="font-family: 'Courier New', Courier, monospace; font-size: 36px; font-weight: bold; color: #4f46e5;">{{.MFACode}}</span>
                            </div>
                            
                            <p style="margin: 30px 0 0; font-size: 14px; color: #9ca3af;">
                                Ce code expirera dans **{{.ExpiresIn}} minutes**. <br>
                                Si vous n'êtes pas à l'origine de cette demande, ignorez cet email.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 20px 30px; background-color: #f9fafb; text-align: center; font-size: 12px; color: #9ca3af;">
                            © {{.Year}} {{.BrandName}} - Sécurité du compte
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
